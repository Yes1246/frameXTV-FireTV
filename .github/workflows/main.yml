name: Build frameXTV Fire TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip frameXTV project
        run: unzip -o frameXTV-FireTV-project.zip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build frameXTV APK
        working-directory: frameXTV-FireTV
        run: gradle --no-daemon assembleDebug

      - name: Upload frameXTV APK
        uses: actions/upload-artifact@v4
        with:
          name: frameXTV-FireTV-APK
          path: frameXTV-FireTV/app/build/outputs/apk/debug/app-debug.apk
